AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Beauty AI Backend - Serverless Microservices

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: java21
    Architectures:
      - x86_64
    SnapStart:
      ApplyOn: PublishedVersions
    Environment:
      Variables:
        TABLE_NAME: 'BeautyAiTable'

Resources:
  BeautyAiMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: "beautyai-media-bucket-2026-prod"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ['*']
            ExposedHeaders: ['ETag']
            MaxAge: 3000

  BeautyAiTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: 'BeautyAiTable'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
  BeautyAiHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: auth-service
      Handler: com.beautyai.auth.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: 'BeautyAiTable'
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/auth
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/auth/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  SalonFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: salon-service
      Handler: com.beautyai.salon.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: 'BeautyAiTable'
        - S3CrudPolicy:
            BucketName: "beautyai-media-bucket-2026-prod"
      Environment:
        Variables:
          MEDIA_BUCKET: "beautyai-media-bucket-2026-prod"
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/salons
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/salons/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'
        SitemapApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/sitemap
            Method: GET
            PayloadFormatVersion: '1.0'

  ImageEnhancementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: salon-service
      Handler: com.beautyai.salon.ImageEnhancementHandler::handleRequest
      Policies:
        - S3CrudPolicy:
            BucketName: "beautyai-media-bucket-2026-prod"
      Environment:
        Variables:
          MEDIA_BUCKET: "beautyai-media-bucket-2026-prod"
#      Events:
#        ImageUpload:
#          Type: S3
#          Properties:
#            Bucket: BeautyAiMediaBucket
#            Events: s3:ObjectCreated:*

  BookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: booking-service
      Handler: com.beautyai.booking.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: 'BeautyAiTable'
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/bookings
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/bookings/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ai-service
      Handler: com.beautyai.ai.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: 'BeautyAiTable'
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/ai
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/ai/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: notification-service
      Handler: com.beautyai.notification.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: 'BeautyAiTable'
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/notifications
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/notifications/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  PaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: payment-service
      Handler: com.beautyai.payment.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: 'BeautyAiTable'
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/payments
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/payments/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: analytics-service
      Handler: com.beautyai.analytics.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: 'BeautyAiTable'
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/analytics
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/analytics/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  RedirectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      SnapStart:
        ApplyOn: None
      InlineCode: |
        exports.handler = async (event) => {
            const path = event.rawPath || '';
            let location = 'http://beauty-ai-customer-41482.s3-website-us-east-1.amazonaws.com';
            if (path.includes('admin')) {
                location = 'http://beauty-ai-admin-46074.s3-website-us-east-1.amazonaws.com';
            } else if (path.includes('pihu')) {
                location = 'http://beauty-ai-pihu-frontend-9988.s3-website-us-east-1.amazonaws.com/s/pihu-makeover';
            }
            return {
                statusCode: 301,
                headers: {
                    Location: location
                }
            };
        };
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /go
            Method: GET
            PayloadFormatVersion: '2.0'
        AdminRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /admin
            Method: GET
            PayloadFormatVersion: '2.0'
        PihuRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /pihu
            Method: GET
            PayloadFormatVersion: '2.0'

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${BeautyAiHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  ShortUrl:
    Description: "Short redirect URL"
    Value: !Sub "https://${BeautyAiHttpApi}.execute-api.${AWS::Region}.amazonaws.com/go"



