AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Beauty AI Backend - Serverless Microservices

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: java21
    Architectures:
      - x86_64
    SnapStart:
      ApplyOn: PublishedVersions
    Environment:
      Variables:
        TABLE_NAME: !Ref BeautyAiTable

Resources:
  BeautyAiTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: BeautyAiTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  BeautyAiHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: auth-service
      Handler: com.beautyai.auth.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BeautyAiTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/auth
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/auth/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  SalonFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: salon-service
      Handler: com.beautyai.salon.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BeautyAiTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/salons
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/salons/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'
        SitemapApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/sitemap.xml
            Method: GET
            PayloadFormatVersion: '1.0'

  BookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: booking-service
      Handler: com.beautyai.booking.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BeautyAiTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/bookings
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/bookings/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ai-service
      Handler: com.beautyai.ai.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BeautyAiTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/ai
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/ai/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: notification-service
      Handler: com.beautyai.notification.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BeautyAiTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/notifications
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/notifications/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  PaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: payment-service
      Handler: com.beautyai.payment.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BeautyAiTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/payments
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/payments/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: analytics-service
      Handler: com.beautyai.analytics.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BeautyAiTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/analytics
            Method: ANY
            PayloadFormatVersion: '1.0'
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/v1/analytics/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${BeautyAiHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
    
  FrontendUrl:
    Description: "Frontend S3 Website URL"
    Value: !Sub "http://${FrontendBucket}.s3-website-${AWS::Region}.amazonaws.com"
