AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Beauty AI Backend - Serverless Monolith Architecture

Globals:
  Function:
    Timeout: 30
    MemorySize: 1536
    Runtime: java21
    Architectures:
      - x86_64
    SnapStart:
      ApplyOn: PublishedVersions
    Environment:
      Variables:
        TABLE_NAME: 'BeautyAiTable'
        MEDIA_BUCKET: "beautyai-media-bucket-2026-prod"
        META_APP_ID: '{{resolve:secretsmanager:MetaAppCredentials:SecretString:AppId}}'
        META_APP_SECRET: '{{resolve:secretsmanager:MetaAppCredentials:SecretString:AppSecret}}'
        META_REDIRECT_URI: '{{resolve:secretsmanager:MetaAppCredentials:SecretString:RedirectUri}}'
        META_CONFIG_ID: '{{resolve:secretsmanager:MetaAppCredentials:SecretString:ConfigId}}'
        META_ENCRYPTION_SECRET: '{{resolve:secretsmanager:MetaAppCredentials:SecretString:EncryptionSecret}}'
        META_API_VERSION: 'v22.0'

Resources:
  BeautyAiMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: "beautyai-media-bucket-2026-prod"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ['*']
            ExposedHeaders: ['ETag']
            MaxAge: 3000

  BeautyAiTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: 'BeautyAiTable'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  BeautyAiHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"

  BeautyAiMonolithFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: beautyai-monolith
      Handler: com.beautyai.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: 'BeautyAiTable'
        - S3CrudPolicy:
            BucketName: "beautyai-media-bucket-2026-prod"
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /api/{proxy+}
            Method: ANY
            PayloadFormatVersion: '1.0'

  ImageEnhancementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: beautyai-monolith
      Handler: com.beautyai.salon.ImageEnhancementHandler::handleRequest
      Policies:
        - S3CrudPolicy:
            BucketName: "beautyai-media-bucket-2026-prod"

  RedirectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      SnapStart:
        ApplyOn: None
      InlineCode: |
        exports.handler = async (event) => {
            const path = event.rawPath || '';
            let location = 'http://beautyai.makeup';
            if (path.includes('pihu')) {
                location = 'http://beautyai.makeup/s/pihu-makeover';
            }
            return {
                statusCode: 301,
                headers: {
                    Location: location
                }
            };
        };
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /go
            Method: GET
            PayloadFormatVersion: '2.0'
        AdminRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /admin
            Method: GET
            PayloadFormatVersion: '2.0'
        PihuRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref BeautyAiHttpApi
            Path: /pihu
            Method: GET
            PayloadFormatVersion: '2.0'

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${BeautyAiHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  ShortUrl:
    Description: "Short redirect URL"
    Value: !Sub "https://${BeautyAiHttpApi}.execute-api.${AWS::Region}.amazonaws.com/go"
